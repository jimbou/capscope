<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CapScope logo</title>
  <desc id="desc">Nested capability scopes stop an incoming unauthorized request.</desc>
  <rect width="512" height="512" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Task-wide authority ceiling -->
    <path d="M344 150 A150 150 0 1 0 344 362"/>
    <!-- Attenuated per-agent capability scope -->
    <path d="M312 204 A90 90 0 1 0 312 308"/>
    <!-- Host-side authorization boundary -->
    <path d="M356 190 V322"/>
    <!-- Untrusted tool request -->
    <path d="M452 256 H382 M398 240 L382 256 398 272"/>
  </g>
  <circle cx="238" cy="256" r="8" fill="#000"/>
</svg>
